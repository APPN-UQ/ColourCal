[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colourcal"
version = "0.1.0"
description = "Colour correction from a ColorChecker chart"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-contrib-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]
